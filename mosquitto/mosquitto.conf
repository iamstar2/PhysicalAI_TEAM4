# 로컬/사내망 데모용 기본 설정: 인증 없이 그대로 동작 (docker-compose.yml, 단일 호스트 데모).
listener 1883
listener 9001
protocol websockets
allow_anonymous true

# --- 외부 네트워크에 노출할 때 (인증 + ACL만, TLS 없이) ---
# 1) allow_anonymous 를 false로 바꾸고
# 2) 비밀번호 파일을 만든다:
#      docker exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd <MQTT_USER>
# 3) 아래 두 줄의 주석을 해제한다:
# allow_anonymous false
# password_file /mosquitto/config/passwd
#
# bus.py는 MQTT_USER/MQTT_PASS 환경변수가 설정되어 있으면 자동으로
# username/password 인증을 사용하므로, 브로커 쪽 설정만 바꾸면 팀원 코드 수정은 필요 없다.

# --- 목표 아키텍처 (Hw설계도.png, docker-compose.host1.yml): TLS(:8883) + 인증 + ACL + MQTT 5.0 ---
# 실제 배포(2-호스트 구성)에서 브로커를 외부에 노출할 때 적용한다. 로컬 데모에서는 켜지 않는다.
#
# 1) 인증서 준비 (자체 서명 또는 Let's Encrypt 등)를 mosquitto/certs/ 에 배치:
#      mosquitto/certs/ca.crt
#      mosquitto/certs/server.crt
#      mosquitto/certs/server.key
# 2) 비밀번호 파일(위 "외부 네트워크에 노출할 때" 1번과 동일 절차) + ACL 파일 준비
#      (ACL 규칙 예시: mosquitto/acl.conf.example — 노드별 발행/구독 권한을
#      schema/topics.json 기준으로 정의해 뒀다. 실제 파일명으로 복사해서 쓴다)
# 3) 아래 블록의 주석을 해제:
#
# listener 8883
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# require_certificate false
#
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl.conf

persistence true
persistence_location /mosquitto/data/
