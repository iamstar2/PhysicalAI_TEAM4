# 로컬 단일 호스트 데모용 (개발 중 기본으로 사용). 브로커·4대 로봇·DB를 전부 한 대에서
# 같이 띄운다. mosquitto는 TLS 없이 1883/9001만 연다.
#
# 목표 아키텍처(Hw설계도.png, 브로커/수집 호스트 + API서버/DB/대시보드 호스트로 분리)는
# docker-compose.host1.yml / docker-compose.host2.yml 참고. 그쪽은 api-server·collector가
# 추가되고 TLS(:8883)+ACL이 켜지는 실제 배포용 구성이다.
#
# vision-service / dialog-service / escort-service / security-dashboard 는
# 각자 팀원 디렉터리에서 자기 코드/의존성으로 빌드한다고 가정.
# 실제 경로(build.context)는 팀 저장소 구조에 맞게 바꿀 것.
#
# 참고: 메시지 포맷은 schema/mechdog_messages.schema.json (JSON Schema)이 유일한 스펙이라
# 컨테이너에 별도로 설치할 공용 패키지가 없다. 각자 서비스 코드에서 이 스펙에 맞는 JSON을
# 만들어 MQTT_HOST/MQTT_PORT(및 필요 시 MQTT_USER/MQTT_PASS)로 붙으면 된다.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket (대시보드가 브라우저에서 직접 구독)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  vision-service:
    build:
      context: ./vision-service   # 여도훈
    container_name: mechdog_a
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      # 외부 노출 시에만 설정 (.env로 주입). 로컬 데모는 비워두면 인증 없이 동작.
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
      MECHDOG_SNAPSHOT_ROOT: /data/snap
      MECHDOG_AUDIO_ROOT: /data/audio
    volumes:
      - snap_data:/data/snap
      - audio_data:/data/audio

  dialog-service:
    build:
      context: ./dialog-service   # 김별이
    container_name: mechdog_b
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
    volumes:
      - audio_data:/data/audio

  escort-service:
    build:
      context: ./escort-service   # 최현수 (에스코트 + MQTT->DB 브릿지)
    container_name: mechdog_c
    depends_on:
      - mosquitto
      - postgres
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
      DATABASE_URL: postgresql://mechdog:mechdog@postgres:5432/mechdog
    volumes:
      - snap_data:/data/snap

  security-dashboard:
    build:
      context: ./security-dashboard   # 백경률 (경고 상태머신 + 대시보드 서버)
    container_name: mechdog_d
    depends_on:
      - mosquitto
    ports:
      - "3000:3000"   # 대시보드 웹
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
    volumes:
      - snap_data:/data/snap

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mechdog
      POSTGRES_PASSWORD: mechdog
      POSTGRES_DB: mechdog
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  snap_data:
  audio_data:
  mosquitto_data:
  postgres_data:
