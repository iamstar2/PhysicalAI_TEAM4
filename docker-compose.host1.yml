# 호스트 1 — 브로커 / 수집 (Hw설계도.png 기준)
#
# 4대 로봇(A/B/C/D)이 MQTT로 직접 붙는 브로커와, 판정 없이 이벤트를 그대로 적재하는
# 수집서버만 이 호스트에 둔다. 판정 로직·DB·대시보드는 호스트2(docker-compose.host2.yml)에 있다.
#
# 사용법 — 두 가지 모드:
#
#   1) 로컬 한 대에서 전부 실행 (개발용): host2와 같이 -f 두 번으로 띄운다.
#      두 파일이 하나의 프로젝트로 합쳐져 같은 네트워크를 쓰므로, host2의
#      MQTT_HOST 기본값(mosquitto)이 이 파일의 브로커 서비스명과 그대로 맞는다.
#        docker compose -f docker-compose.host1.yml -f docker-compose.host2.yml up -d
#
#   2) 실제 2-호스트 분리 배포: 이 파일만 브로커 서버에서 실행하고,
#      host2는 다른 서버에서 HOST1_MQTT_HOST=<이 서버 주소>로 실행한다.
#        docker compose -f docker-compose.host1.yml up -d
#
# TLS(:8883)+인증+ACL을 켜려면 mosquitto/mosquitto.conf 하단의 "목표 아키텍처" 블록
# 주석을 해제하고, mosquitto/certs/*.{crt,key}, mosquitto/passwd, mosquitto/acl.conf
# (mosquitto/acl.conf.example 참고)를 준비한 뒤 아래 볼륨 마운트 주석도 해제한다.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"   # MQTT (로컬 데모 기본)
      - "9001:9001"   # WebSocket (대시보드가 브라우저에서 직접 구독)
      # - "8883:8883" # MQTT over TLS (목표 아키텍처, 외부 노출 시에만 오픈)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      # - ./mosquitto/certs:/mosquitto/config/certs:ro
      # - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      # - ./mosquitto/acl.conf:/mosquitto/config/acl.conf:ro

  collector:
    build:
      context: ./collector   # 여도훈 — 브로커 구독 전용, 판정·정규화 없이 원시 이벤트 수집만
    container_name: collector
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"   # TLS 사용 시 8883으로, MQTT_USER/PASS도 함께 설정
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
      # 수집한 원시 이벤트를 호스트2의 API 서버로 전달할 때 사용 (HTTP(S))
      API_SERVER_URL: ${API_SERVER_URL:-http://host2:8080}
    volumes:
      - collector_data:/data/ingest

volumes:
  mosquitto_data:
  collector_data:
