[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mechdog-common"
version = "0.1.0"
description = "MechDog 출입 통제 프로젝트 공용 MQTT 메시지 규약 패키지"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "paho-mqtt>=1.6,<2",
]

[tool.setuptools.packages.find]
include = ["mechdog_common*"]
