# 로컬/사내망 데모용 기본 설정: 인증 없이 그대로 동작.
listener 1883
listener 9001
protocol websockets
allow_anonymous true

# --- 외부 네트워크에 노출할 때 ---
# 1) allow_anonymous 를 false로 바꾸고
# 2) 비밀번호 파일을 만든다:
#      docker exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd <MQTT_USER>
# 3) 아래 두 줄의 주석을 해제한다:
# allow_anonymous false
# password_file /mosquitto/config/passwd
#
# bus.py는 MQTT_USER/MQTT_PASS 환경변수가 설정되어 있으면 자동으로
# username/password 인증을 사용하므로, 브로커 쪽 설정만 바꾸면 팀원 코드 수정은 필요 없다.

persistence true
persistence_location /mosquitto/data/
