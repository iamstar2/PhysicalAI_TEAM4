# A 노트북 (여도훈) — MQTT 브로커 + 수집서버
#   docker compose -f deploy/a-broker.yml up -d                      # 브로커만
#   docker compose -f deploy/a-broker.yml --profile collector up -d  # 수집서버 코드가 생긴 뒤
# 로봇 4대 · B 파이 · D 대시보드가 전부 여기(BROKER_IP:1883)에 붙는다 — 시연 중에 꺼지면 전원이 끊긴다.
# 수집서버 값은 '필수(:?)' 로 걸지 않는다 — 걸면 프로필이 꺼져 있어도 compose 가 파일 전체를 거부해
# 브로커만 띄우는 것조차 막힌다 (10/3 새 노트북 점검에서 발견).

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket
    volumes:
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  collector:
    profiles: ["collector"]           # ../collector 코드가 아직 없어서 기본으로는 안 띄운다
    build:
      context: ../collector
    container_name: collector
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto            # 같은 노트북의 브로커
      MQTT_PORT: "1883"
      API_SERVER_URL: http://${API_IP:-API_IP_미설정}:8080   # deploy/.env 의 API_IP
      API_TOKEN: ${COLLECTOR_TOKEN:-}                      # deploy/.env 의 COLLECTOR_TOKEN
    volumes:
      - collector_data:/data/ingest   # API 서버가 꺼져 있을 때 쌓아 둘 곳

volumes:
  mosquitto_data:
  collector_data:
